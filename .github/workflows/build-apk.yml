name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Enable Android
        run: flutter config --enable-android

      - name: Recreate Android platform files
        run: |
          rm -rf android ios web linux macos windows
          flutter create . --project-name calorie_wallet --org com.caloriewallet --platforms=android
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:label="Calorie Wallet"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"
                      />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <receiver
                      android:name=".CalorieWalletWidgetProvider"
                      android:exported="true"
                      android:label="Calorie Wallet">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/calorie_wallet_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Verify offline (no INTERNET permission)
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission still present"
            exit 1
          fi
          echo "OK: no INTERNET permission – app is offline-only"
          grep "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Add home screen widget
        run: |
          PKG_DIR="android/app/src/main/kotlin/com/caloriewallet/calorie_wallet"
          mkdir -p "$PKG_DIR"

          cat > "$PKG_DIR/CalorieWalletWidgetProvider.kt" << 'KOTEOF'
          package com.caloriewallet.calorie_wallet

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.net.Uri
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetProvider

          class CalorieWalletWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray,
                  widgetData: SharedPreferences
              ) {
                  for (widgetId in appWidgetIds) {
                      val views = RemoteViews(context.packageName, R.layout.calorie_wallet_widget).apply {
                          setTextViewText(
                              R.id.widget_available,
                              widgetData.getString("available", "0") ?: "0"
                          )
                          setTextViewText(
                              R.id.widget_target,
                              "Lohn " + (widgetData.getString("target", "0") ?: "0") + " kcal"
                          )
                          setTextViewText(
                              R.id.widget_spent,
                              "ausgegeben " + (widgetData.getString("spent", "0") ?: "0")
                          )
                          setProgressBar(
                              R.id.widget_progress,
                              100,
                              widgetData.getInt("progress", 0),
                              false
                          )
                          val intent = HomeWidgetLaunchIntent.getActivity(
                              context,
                              MainActivity::class.java,
                              Uri.parse("caloriewallet://booking")
                          )
                          setOnClickPendingIntent(R.id.widget_root, intent)
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          KOTEOF

          mkdir -p android/app/src/main/res/layout
          cat > android/app/src/main/res/layout/calorie_wallet_widget.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#FF000000"
              android:orientation="vertical"
              android:paddingLeft="14dp"
              android:paddingRight="14dp"
              android:paddingTop="8dp"
              android:paddingBottom="8dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="WOCHENBUDGET VERFÜGBAR"
                  android:textColor="#FF9E9E9E"
                  android:textSize="9sp"
                  android:letterSpacing="0.1"
                  android:textStyle="bold"
                  android:includeFontPadding="false" />

              <TextView
                  android:id="@+id/widget_available"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:text="0"
                  android:textColor="#FFFFFFFF"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:fontFamily="monospace"
                  android:includeFontPadding="false" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/widget_target"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Lohn 0 kcal"
                      android:textColor="#FFBDBDBD"
                      android:textSize="10sp"
                      android:includeFontPadding="false" />

                  <TextView
                      android:id="@+id/widget_spent"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ausgegeben 0"
                      android:textColor="#FFBDBDBD"
                      android:textSize="10sp"
                      android:includeFontPadding="false" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/widget_progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:layout_marginTop="6dp"
                  android:max="100"
                  android:progress="0"
                  android:progressTint="#FFFFFFFF"
                  android:progressBackgroundTint="#FF424242" />
          </LinearLayout>
          XMLEOF

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/calorie_wallet_widget_info.xml << 'INFOEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="60dp"
              android:minResizeHeight="60dp"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/calorie_wallet_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/widget_description" />
          INFOEOF

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/strings.xml << 'STREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Calorie Wallet</string>
              <string name="widget_description">Wochenbudget auf einen Blick</string>
          </resources>
          STREOF

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30