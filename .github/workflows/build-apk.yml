name: Build APK

on:
  workflow_dispatch:  # manuell starten
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create full Flutter project structure
        run: |
          flutter create . --project-name calorie_wallet --org com.caloriewallet --platforms=android || true
          # Unsere Dateien überschreiben die generierten
          # pubspec und lib bleiben wie im Repo

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
