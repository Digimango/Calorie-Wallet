name: calorie_wallet
description: Calorie Wallet – Dein persönliches Banking für Ernährung. Keine Moral, nur Budget.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "app_icon.png"